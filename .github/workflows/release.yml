name: Build apps

# Builds the one-file MeshRight app for Windows, macOS and Linux.
# Run it by hand from the Actions tab, or push a tag like v0.2.0 to also
# publish a GitHub release with the three files attached.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    # Branch pushes build only when the packaging itself changes.
    # (GitHub ignores path filters for tag pushes, so tags always build.)
    branches: ["**"]
    paths: ["packaging/**", ".github/workflows/release.yml"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file: MeshRight.exe
            asset: MeshRight-windows.exe
          - os: macos-latest
            file: MeshRight
            asset: MeshRight-macos
          - os: ubuntu-22.04
            file: MeshRight
            asset: MeshRight-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install ".[dev]" pyinstaller
      - name: Test
        run: pytest -q
      - name: Build
        shell: bash
        run: packaging/build.sh
      - name: Smoke test the app
        shell: bash
        run: |
          ./dist/${{ matrix.file }} serve --no-browser --port 8765 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/api/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8765/api/health
      - name: Name the file
        shell: bash
        run: mv "dist/${{ matrix.file }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
