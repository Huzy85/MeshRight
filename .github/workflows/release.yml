name: Build apps

# Builds the one-file MeshRight app for Windows, macOS and Linux.
# Releases normally happen by themselves (see pypi.yml, which calls this).
# It can also be run by hand from the Actions tab, and a pushed tag like
# v0.2.0 still publishes a GitHub release with the three files attached.

on:
  workflow_call:
  workflow_dispatch:
  push:
    tags: ["v*"]
    # Branch pushes build only when the packaging itself changes.
    # (GitHub ignores path filters for tag pushes, so tags always build.)
    branches: ["**"]
    paths: ["packaging/**", ".github/workflows/release.yml"]

# Pinned to exact versions: a changed action cannot slip into a release.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file: MeshRight.exe
            asset: MeshRight-windows.exe
          - os: macos-latest
            file: MeshRight
            asset: MeshRight-macos
          - os: ubuntu-22.04
            file: MeshRight
            asset: MeshRight-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        # The app includes the E57, LAS/LAZ and AI-app (MCP) extras. USD is
        # left out: it would more than double the download.
        run: pip install ".[dev,e57,las,mcp]" pyinstaller
      - name: Test
        run: pytest -q
      - name: Build
        shell: bash
        run: packaging/build.sh
      - name: Smoke test the app
        shell: bash
        run: |
          ./dist/${{ matrix.file }} serve --no-browser --port 8765 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/api/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8765/api/health
      - name: Name the file
        shell: bash
        run: mv "dist/${{ matrix.file }}" "dist/${{ matrix.asset }}"
      - name: Measure the download
        # The one-file app must stay a quick download. The size goes in the
        # job summary; above the limit the build fails so a heavy new
        # dependency is noticed before it ships.
        shell: bash
        env:
          LIMIT_MB: 180
        run: |
          size=$(wc -c < "dist/${{ matrix.asset }}")
          mb=$(( size / 1048576 ))
          echo "${{ matrix.asset }}: ${mb} MB" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$mb" -gt "$LIMIT_MB" ]; then
            echo "::error::${{ matrix.asset }} is ${mb} MB, over the ${LIMIT_MB} MB limit. See CONTRIBUTING.md, 'Keep the download small'."
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
