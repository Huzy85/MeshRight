[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meshright"
dynamic = ["version"]
description = "Free, open source, browser-based 3D mesh checking and repair for 3D printing."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "MeshRight contributors" }]
requires-python = ">=3.10"
keywords = ["3d-printing", "mesh", "mesh-repair", "stl", "3d-scanning", "meshmixer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "trimesh>=4.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=3.0",
    "lxml>=4.9",
    "defusedxml>=0.7",  # safe parsing of AMF and 3MF metadata XML
    "fastapi>=0.115",
    "starlette>=1.3.1",  # older versions have known denial-of-service bugs
    "uvicorn>=0.27",
    "python-multipart>=0.0.31",  # older versions have known denial-of-service bugs
    "pymeshfix>=0.17",
    "fast-simplification>=0.1.7",
    "PyMCubes>=0.1.4",
    "manifold3d>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Optional readers: binary USD (usdc, and usdz from iPhone Object Capture)
# and E57 laser-scanner files. Text USD (usda) needs nothing extra.
usd = ["usd-core>=24.0"]
e57 = ["pye57>=0.4"]
# LAS and LAZ laser scans (survey and drone scanners).
las = ["laspy>=2.5", "lazrs>=0.6"]
# `meshright mcp`: MeshRight's tools for AI apps (Claude, Cursor and others).
mcp = ["mcp>=2.3"]

[project.scripts]
meshright = "meshright.cli:main"

[project.urls]
Homepage = "https://github.com/Huzy85/MeshRight"
Issues = "https://github.com/Huzy85/MeshRight/issues"

[tool.hatch.version]
path = "src/meshright/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/meshright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: downloads real models from the internet; deselect with -m 'not slow'",
]
